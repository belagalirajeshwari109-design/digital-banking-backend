spring.application.name=digital-banking-backend
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/digital_banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=digital-banking-super-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
jwt.expiration-ms=28800000

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
